<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" font-family="Arial, Helvetica, sans-serif">
  <rect width="1400" height="1100" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="45" font-size="24" font-weight="bold">mini-SPOT wiring: ESP32 DevKit</text>
  <text x="40" y="72" font-size="14" fill="#444">Changes vs. old plan: ESP32-S2 → ESP32 DevKit (SDA 21 / SCL 22) · OE now wired (GPIO25) · + BNO055 IMU · + 4 FSR foot sensors · servo channels grouped per leg</text>

  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- battery + / switch / buck (servo power, red) -->
    <polyline points="140,540 140,170 225,170" stroke="#d32f2f"/>
    <polyline points="300,170 380,170" stroke="#d32f2f"/>
    <polyline points="560,170 680,170" stroke="#d32f2f"/>
    <!-- battery - / ground -->
    <polyline points="140,560 140,620 190,620 190,200 225,200" stroke="#000"/>
    <polyline points="300,200 380,200" stroke="#000"/>
    <polyline points="560,200 680,200" stroke="#000"/>

    <!-- PCA servo outputs -->
    <line x1="900" y1="175" x2="1000" y2="175" stroke="#555"/>
    <line x1="900" y1="210" x2="1000" y2="210" stroke="#555"/>
    <line x1="900" y1="245" x2="1000" y2="245" stroke="#555"/>
    <line x1="900" y1="280" x2="1000" y2="280" stroke="#555"/>

    <!-- PCA V+ -> LM1085 -->
    <polyline points="900,360 1100,360" stroke="#d32f2f"/>
    <!-- LM1085 out -> 3V3 bus, LM GND -> GND bus -->
    <polyline points="1230,380 1320,380 1320,660" stroke="#f57c00"/>
    <polyline points="1140,430 1140,690" stroke="#000"/>

    <!-- PCA logic pins down to buses -->
    <polyline points="900,385 920,385 920,660" stroke="#f57c00"/>
    <polyline points="900,410 950,410 950,720" stroke="#1565c0"/>
    <polyline points="900,435 965,435 965,750" stroke="#2e7d32"/>
    <polyline points="900,460 980,460 980,780" stroke="#7b1fa2"/>
    <polyline points="900,485 935,485 935,690" stroke="#000"/>

    <!-- buses from ESP32 -->
    <line x1="640" y1="660" x2="1320" y2="660" stroke="#f57c00"/>
    <line x1="640" y1="690" x2="1160" y2="690" stroke="#000"/>
    <line x1="640" y1="720" x2="1210" y2="720" stroke="#1565c0"/>
    <line x1="640" y1="750" x2="1260" y2="750" stroke="#2e7d32"/>
    <line x1="640" y1="780" x2="980" y2="780" stroke="#7b1fa2"/>

    <!-- BNO055 up to buses -->
    <line x1="1110" y1="840" x2="1110" y2="660" stroke="#f57c00"/>
    <line x1="1160" y1="840" x2="1160" y2="690" stroke="#000"/>
    <line x1="1210" y1="840" x2="1210" y2="720" stroke="#1565c0"/>
    <line x1="1260" y1="840" x2="1260" y2="750" stroke="#2e7d32"/>

    <!-- FSR signals -->
    <line x1="640" y1="865" x2="700" y2="865" stroke="#8d6e63"/>
    <line x1="640" y1="895" x2="700" y2="895" stroke="#8d6e63"/>
    <line x1="640" y1="925" x2="700" y2="925" stroke="#8d6e63"/>
    <line x1="640" y1="955" x2="700" y2="955" stroke="#8d6e63"/>

    <!-- USB to Jetson -->
    <line x1="420" y1="940" x2="330" y2="940" stroke="#555" stroke-dasharray="6 4"/>
  </g>

  <!-- junction dots -->
  <g fill="#000">
    <circle cx="920" cy="660" r="5" fill="#f57c00"/>
    <circle cx="1110" cy="660" r="5" fill="#f57c00"/>
    <circle cx="1320" cy="660" r="5" fill="#f57c00"/>
    <circle cx="935" cy="690" r="5"/>
    <circle cx="1140" cy="690" r="5"/>
    <circle cx="1160" cy="690" r="5"/>
    <circle cx="950" cy="720" r="5" fill="#1565c0"/>
    <circle cx="1210" cy="720" r="5" fill="#1565c0"/>
    <circle cx="965" cy="750" r="5" fill="#2e7d32"/>
    <circle cx="1260" cy="750" r="5" fill="#2e7d32"/>
    <circle cx="980" cy="780" r="5" fill="#7b1fa2"/>
  </g>

  <!-- battery -->
  <line x1="100" y1="540" x2="180" y2="540" stroke="#000" stroke-width="3"/>
  <rect x="118" y="552" width="44" height="8" fill="#000"/>
  <text x="112" y="533" font-size="16">+</text>
  <text x="195" y="560" font-size="18">7.4V LiPo (2S)</text>

  <!-- switch (2-pole) -->
  <g stroke="#000" stroke-width="2" fill="#fff">
    <circle cx="225" cy="170" r="5"/><circle cx="300" cy="170" r="5"/>
    <circle cx="225" cy="200" r="5"/><circle cx="300" cy="200" r="5"/>
    <line x1="225" y1="170" x2="292" y2="148"/>
    <line x1="225" y1="200" x2="292" y2="178"/>
    <line x1="258" y1="159" x2="258" y2="189" stroke-dasharray="4 3"/>
  </g>
  <text x="225" y="128" font-size="14">Main switch</text>

  <!-- buck converter -->
  <rect x="380" y="130" width="180" height="130" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="388" y="175" font-size="12">V+</text><text x="388" y="205" font-size="12">Gnd</text>
  <text x="552" y="175" font-size="12" text-anchor="end">V+</text><text x="552" y="205" font-size="12" text-anchor="end">Gnd</text>
  <text x="470" y="232" font-size="18" text-anchor="middle">HW-439</text>
  <text x="470" y="252" font-size="13" text-anchor="middle">Buck → servo voltage</text>

  <!-- PCA9685 -->
  <rect x="680" y="120" width="220" height="390" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="688" y="175" font-size="12">V+</text><text x="688" y="205" font-size="12">Gnd</text>
  <text x="688" y="222" font-size="11" fill="#555">(screw terminal)</text>
  <text x="892" y="179" font-size="12" text-anchor="end">ch 0–2</text>
  <text x="892" y="214" font-size="12" text-anchor="end">ch 4–6</text>
  <text x="892" y="249" font-size="12" text-anchor="end">ch 8–10</text>
  <text x="892" y="284" font-size="12" text-anchor="end">ch 12–14</text>
  <text x="770" y="300" font-size="20" text-anchor="middle">PCA9685</text>
  <text x="770" y="324" font-size="15" text-anchor="middle">Servo driver</text>
  <text x="770" y="344" font-size="13" text-anchor="middle" fill="#555">I2C 0x40</text>
  <text x="892" y="365" font-size="12" text-anchor="end">V+</text>
  <text x="892" y="390" font-size="12" text-anchor="end">Vcc</text>
  <text x="892" y="415" font-size="12" text-anchor="end">SDA</text>
  <text x="892" y="440" font-size="12" text-anchor="end">SCL</text>
  <text x="892" y="465" font-size="12" text-anchor="end">OE</text>
  <text x="892" y="490" font-size="12" text-anchor="end">Gnd</text>

  <!-- servos -->
  <rect x="1000" y="150" width="340" height="150" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="1000" y="138" font-size="16">Servos ×12 (each header: PWM / V+ / Gnd)</text>
  <text x="1012" y="180" font-size="14" font-weight="bold">FR</text><text x="1045" y="180" font-size="14">ch0 shoulder · ch1 thigh · ch2 calf</text>
  <text x="1012" y="215" font-size="14" font-weight="bold">FL</text><text x="1045" y="215" font-size="14">ch4 shoulder · ch5 thigh · ch6 calf</text>
  <text x="1012" y="250" font-size="14" font-weight="bold">RR</text><text x="1045" y="250" font-size="14">ch8 shoulder · ch9 thigh · ch10 calf</text>
  <text x="1012" y="285" font-size="14" font-weight="bold">RL</text><text x="1045" y="285" font-size="14">ch12 shoulder · ch13 thigh · ch14 calf</text>

  <!-- LM1085 -->
  <rect x="1100" y="330" width="130" height="100" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="1106" y="356" font-size="12">V+</text>
  <text x="1224" y="376" font-size="12" text-anchor="end">3.3V</text>
  <text x="1146" y="424" font-size="12">Gnd</text>
  <text x="1165" y="395" font-size="14" text-anchor="middle">LM1085IT-3.3</text>

  <!-- ESP32 DevKit -->
  <rect x="420" y="620" width="220" height="400" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="632" y="665" font-size="12" text-anchor="end">3V3</text>
  <text x="632" y="695" font-size="12" text-anchor="end">GND</text>
  <text x="632" y="725" font-size="12" text-anchor="end">GPIO21 (SDA)</text>
  <text x="632" y="755" font-size="12" text-anchor="end">GPIO22 (SCL)</text>
  <text x="632" y="785" font-size="12" text-anchor="end">GPIO25 (OE)</text>
  <text x="632" y="870" font-size="12" text-anchor="end">GPIO32</text>
  <text x="632" y="900" font-size="12" text-anchor="end">GPIO33</text>
  <text x="632" y="930" font-size="12" text-anchor="end">GPIO34</text>
  <text x="632" y="960" font-size="12" text-anchor="end">GPIO35</text>
  <text x="480" y="830" font-size="20" text-anchor="middle">ESP32</text>
  <text x="480" y="852" font-size="16" text-anchor="middle">DevKit</text>
  <text x="428" y="935" font-size="12">USB</text>
  <text x="325" y="935" font-size="13" text-anchor="end">Jetson Nano</text>
  <text x="325" y="952" font-size="11" text-anchor="end" fill="#555">(serial + flashing)</text>

  <!-- BNO055 -->
  <rect x="1080" y="840" width="220" height="140" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="1110" y="858" font-size="11" text-anchor="middle">VIN</text>
  <text x="1160" y="858" font-size="11" text-anchor="middle">GND</text>
  <text x="1210" y="858" font-size="11" text-anchor="middle">SDA</text>
  <text x="1260" y="858" font-size="11" text-anchor="middle">SCL</text>
  <text x="1190" y="905" font-size="20" text-anchor="middle">BNO055 IMU</text>
  <text x="1190" y="928" font-size="13" text-anchor="middle" fill="#555">I2C 0x28 / 0x29 (ADR pin)</text>
  <text x="1190" y="948" font-size="13" text-anchor="middle" fill="#555">same bus as PCA9685</text>

  <!-- FSR block -->
  <rect x="700" y="835" width="330" height="185" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="700" y="827" font-size="15">FSR foot sensors ×4 (voltage divider each)</text>
  <text x="708" y="869" font-size="12">FR foot</text>
  <text x="708" y="899" font-size="12">FL foot</text>
  <text x="708" y="929" font-size="12">RR foot</text>
  <text x="708" y="959" font-size="12">RL foot</text>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="940" y1="858" x2="940" y2="870"/>
    <rect x="928" y="870" width="24" height="38" fill="#fff"/>
    <line x1="940" y1="908" x2="940" y2="940"/>
    <rect x="930" y="940" width="20" height="36" fill="#fff"/>
    <line x1="940" y1="976" x2="940" y2="992"/>
    <line x1="926" y1="992" x2="954" y2="992"/>
    <line x1="931" y1="998" x2="949" y2="998"/>
    <line x1="936" y1="1004" x2="944" y2="1004"/>
    <line x1="940" y1="924" x2="870" y2="924" stroke="#8d6e63"/>
  </g>
  <circle cx="940" cy="924" r="4" fill="#000"/>
  <text x="940" y="853" font-size="12" text-anchor="middle">3V3</text>
  <text x="960" y="894" font-size="12">FSR</text>
  <text x="958" y="963" font-size="12">10 kΩ</text>
  <text x="866" y="920" font-size="11" text-anchor="end">→ its GPIO</text>

  <!-- number badges -->
  <g font-size="22" font-weight="bold" text-anchor="middle">
    <g transform="translate(760,152)"><polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#ffeb3b"/><text y="8">1</text></g>
    <g transform="translate(1340,150)"><polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#ffeb3b"/><text y="8">2</text></g>
    <g transform="translate(455,650)"><polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#ffeb3b"/><text y="8">3</text></g>
    <g transform="translate(262,235)"><polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#ffeb3b"/><text y="8">4</text></g>
    <g transform="translate(1230,330)"><polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#ffeb3b"/><text y="8">5</text></g>
    <g transform="translate(470,110)"><polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#ffeb3b"/><text y="8">6</text></g>
    <g transform="translate(1300,980)"><polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#ffeb3b"/><text y="8">7</text></g>
    <g transform="translate(1030,1020)"><polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#ffeb3b"/><text y="8">8</text></g>
  </g>

  <!-- legend -->
  <g font-size="13">
    <rect x="40" y="680" width="290" height="200" fill="#fff" stroke="#999"/>
    <text x="52" y="702" font-weight="bold">Legend</text>
    <line x1="52" y1="722" x2="92" y2="722" stroke="#d32f2f" stroke-width="3"/><text x="102" y="727">Servo power V+ (from buck)</text>
    <line x1="52" y1="746" x2="92" y2="746" stroke="#f57c00" stroke-width="3"/><text x="102" y="751">3.3 V logic</text>
    <line x1="52" y1="770" x2="92" y2="770" stroke="#000" stroke-width="3"/><text x="102" y="775">GND (all grounds common)</text>
    <line x1="52" y1="794" x2="92" y2="794" stroke="#1565c0" stroke-width="3"/><text x="102" y="799">I2C SDA</text>
    <line x1="52" y1="818" x2="92" y2="818" stroke="#2e7d32" stroke-width="3"/><text x="102" y="823">I2C SCL</text>
    <line x1="52" y1="842" x2="92" y2="842" stroke="#7b1fa2" stroke-width="3"/><text x="102" y="847">PCA9685 OE (LOW = servos on)</text>
    <line x1="52" y1="866" x2="92" y2="866" stroke="#8d6e63" stroke-width="3"/><text x="102" y="871">FSR analog signals (ADC1)</text>
  </g>
  <text x="40" y="1075" font-size="12" fill="#555">1 PCA9685 · 2 Servos · 3 ESP32 DevKit · 4 Main switch · 5 LM1085 3.3 V LDO · 6 HW-439 buck · 7 BNO055 · 8 FSR ×4</text>
</svg>
