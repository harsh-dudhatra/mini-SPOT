; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_flags = 
	-D BOARD_ESP32S2
lib_deps = 
	adafruit/Adafruit PWM Servo Driver Library
	adafruit/Adafruit BNO055@^1.6.4

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_flags = 
	-D BOARD_ESP32DEV
lib_deps = 
	adafruit/Adafruit PWM Servo Driver Library
	adafruit/Adafruit BNO055@^1.6.4

; limit finder (experiments/servo_test_limit.cpp) instead of src/main.cpp, on the DevKit
[env:limits]
extends = env:esp32dev
; keys go to the ESP32 immediately (no Enter), no echo
monitor_filters = default
monitor_echo = no
build_src_filter = -<*> +<../experiments/servo_test_limit.cpp>

; limit finder on the old ESP32-S2 perfboard (old servo channels)
[env:limits_s2]
extends = env:esp32s2
; keys go to the ESP32 immediately (no Enter), no echo
monitor_filters = default
monitor_echo = no
build_flags =
  -D BOARD_ESP32S2
  -D OLD_WIRING
build_src_filter = -<*> +<../experiments/servo_test_limit.cpp>
